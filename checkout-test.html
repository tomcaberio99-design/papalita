<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Papalita · Controlled Pickup Checkout Test</title><style>body{font:16px system-ui;background:#f5faf6;color:#183426;max-width:660px;margin:30px auto;padding:16px}main{background:white;border:1px solid #dce8df;border-radius:18px;padding:24px}input,button{font:inherit;padding:12px;border:1px solid #b5c8b9;border-radius:9px;width:100%;box-sizing:border-box;margin:6px 0 16px}button{background:#087f32;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;word-break:break-word;background:#f0f5f0;padding:15px;border-radius:8px}.warn{color:#9a4500}</style><main><h1>Papalita · Pickup Checkout Test</h1><p class="warn"><b>TEST ONLY.</b> Use a specially created active test product in an approved store. A successful order will deduct stock and create a real database order. Do not use a live customer product. Never publish this page permanently.</p><p id="who">Checking signed-in account…</p><label>Approved store UUID<input id="store" placeholder="Store UUID"></label><label>TEST product UUID (no required options)<input id="product" placeholder="Product UUID"></label><label>Quantity<input id="qty" type="number" min="1" max="5" value="1"></label><label>Contact number<input id="phone" placeholder="09XXXXXXXXX"></label><label><input id="confirm" type="checkbox" style="width:auto"> I understand this creates a real test order and deducts stock.</label><button id="run" disabled>Run pickup checkout</button><pre id="output">Waiting…</pre></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script>
(async()=>{const db=window.PAPALITA_DB,who=document.getElementById('who'),out=document.getElementById('output'),run=document.getElementById('run');if(!db){who.textContent='Supabase config missing';return;}const {data:{user},error}=await db.auth.getUser();if(error||!user){who.textContent='Not signed in. Log in on the main Papalita site in this browser, then return here.';return;}who.textContent='Signed in: '+user.email+' ('+user.id+')';run.disabled=false;run.onclick=async()=>{if(!document.getElementById('confirm').checked)return alert('Confirm the test first.');const store=document.getElementById('store').value.trim(),product=document.getElementById('product').value.trim(),qty=Number(document.getElementById('qty').value),phone=document.getElementById('phone').value.trim();if(!/^[0-9a-f-]{36}$/i.test(store)||!/^[0-9a-f-]{36}$/i.test(product)||!Number.isInteger(qty)||qty<1||qty>5||!/^09\d{9}$/.test(phone))return alert('Check UUIDs, quantity and phone.');run.disabled=true;out.textContent='Checking test product…';try{const before=await db.from('products').select('id,name,stock,store_id,status,options').eq('id',product).single();if(before.error)throw before.error;if(before.data.store_id!==store||before.data.status!=='active')throw Error('Product/store mismatch or inactive product');if(Array.isArray(before.data.options)&&before.data.options.some(x=>x.req))throw Error('Test page supports products without required options only.');if(before.data.stock<qty)throw Error('Insufficient stock');out.textContent='Creating test order…';const result=await db.rpc('papalita_checkout',{p_store_id:store,p_items:[{product_id:product,quantity:qty,selections:{}}],p_fulfillment_type:'pickup',p_barangay:null,p_delivery_address:null,p_contact_number:phone});if(result.error)throw result.error;const [order,items,after]=await Promise.all([db.from('orders').select('id,status,subtotal,delivery_fee,total_amount,fulfillment_type').eq('id',result.data).single(),db.from('order_items').select('product_name,quantity,unit_price,line_total').eq('order_id',result.data),db.from('products').select('stock').eq('id',product).single()]);out.textContent=JSON.stringify({order_id:result.data,order:order.data,items:items.data,stock_before:before.data.stock,stock_after:after.data?.stock,errors:[order.error?.message,items.error?.message,after.error?.message].filter(Boolean)},null,2);}catch(e){out.textContent='TEST FAILED (check database before retrying): '+e.message;}finally{run.disabled=false;}}})();
</script></html>
